tagline: Understanding and engineering algal carbon fixation
intro: >-
  We study how algae concentrate CO2 to fix carbon, using systems and synthetic
  biology in green algae, diatoms and cyanobacteria. Our goal is to understand
  these mechanisms well enough to rebuild them in crops.
