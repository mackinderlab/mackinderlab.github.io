tagline: Understanding and engineering phytoplankton carbon fixation
intro: We study how algae concentrate CO₂ to fix carbon, using systems and
  synthetic biology in green and red algae, diatoms and cyanobacteria. Our goal is to
  understand these mechanisms well enough to rebuild them in crops.
