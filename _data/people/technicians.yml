- name: Sol Wrathall
  role: Research Technician
  photo: /assets/images/people/sol-wrathall.jpg
  email: sol.wrathall@york.ac.uk
  bio: In 2022 I obtained a PhD in Chemistry at the University of York in the Hunt/Parkin labs, with a research project exploring active site structural dynamics in NiFe-hydrogenases with ultrafast pump-probe and two-dimensional infrared spectroscopy. In 2023 I worked as an analytical scientist in the veterinary medicines division of the food and environment research agency (Fera). In 2024 I joined the Mackinder lab as a research technician with a project focussing on understanding the roles of the carbonic anhydrases in the Chlamydomonas CCM.
- name: Henrique Plihal Ferreira
  role: Laboratory Technician
  photo: /assets/images/people/henrique-plihal-ferreira.jpg
  email: henrique.ferreira@york.ac.uk
  bio: Since my time in high school in Brazil, I have been very interested in Biology, particularly Plant Biology, which eventually led me to study an Integrated Masters degree in Biotechnology and Microbiology at the University of York. My first experience in a working lab was a summer internship at the Mackinder lab in 2024 under Dr Mihris Naduthodi. Fortunately, I would return to the Mackinder lab for my final year project, where I worked under Dr Charlotte Walker alongside Dr Chris MacDonald in characterising two *C. reinhardtii* CCM enzymes by using yeast as an expression system. Since my graduation I have been working as a laboratory technician under Dr Ousmane Dao, where we are aiming to understand more about the *C. reinhardtii* photorespiration proteins. In my free time I enjoy watching sumo wrestling and playing games.
