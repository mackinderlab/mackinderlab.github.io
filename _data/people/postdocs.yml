- name: Charlotte Walker
  role: BBSRC Discovery Fellow
  photo: /assets/images/people/charlotte-walker.jpg
  email: charlotte.walker@york.ac.uk
  bio: 'I completed my BSc in Biological Sciences at the University of Exeter in 2011, after which I left the UK to work on a marine conservation project with the Bahamas National Trust. After 1.5 years of fine tuning my scientific diving skills and avoiding temperate weather, I returned to the UK to study for a MRes in Marine Biology with Plymouth University. My project focused on the molecular monitoring of harmful algal blooms. During this time I developed a fascination for microalgae physiology and how they influence life on Earth. This led on to my Ph.D research which was conducted with the University of Southampton and the Marine Biological Association of the UK whereby I explored mechanisms of calcification in coccolithophores,  photosynthetic marine microalgae which produce calcium carbonate platelets and greatly influence ocean biogeochemistry.


    After finishing my Ph.D I have been fortunate to join the Mackinder Lab here in York. I am really interested in physiology and fundamental life processes, therefore the opportunity to work on Chlamydomonas carbon fixation is really exciting. During the project we will be focusing on characterizing HCO3- transport within the carbon concentrating mechanism.'
- name: Ousmane Dao
  role: Royal Society Career Development Fellow
  photo: /assets/images/people/ousmane-dao.jpg
  email: ousmane.dao@york.ac.uk
  bio: 'After finishing high school in Mali in 2014, I obtained my bachelor''s degree in microbial biotechnology in Algeria at the University Ahmed Ben Bella in 2017. I then joined Agroparistech in Paris Saclay, where I obtained my master''s degree in plant sciences. This master''s degree gave me a taste for academic research, which led me to pursue a PhD in microalgae biology in Li-Beisson''s group at the CEA Cadarache, France. During my PhD, I discovered the world of eukaryotic photosynthesis: from the regulation/management of electron transfer reactions to the Calvin cycle and the mechanism of CO₂ concentration. My PhD thesis focused specifically on the acclimation mechanisms of photosynthesis during environmental fluctuations in CO₂, light and nutrients. To this end, I used the unicellular model microalga *Chlamydomonas reinhardtii*. In Luke''s group, I study the physiological role of pyrenoid-based CCM components in microalgae and test their functionality in plants with the aim of improving productivity. Outside the lab, you''ll find me either on a football pitch, or at home reading books or watching videos.'
- name: Onyou Nam
  role: Postdoctoral Researcher
  photo: /assets/images/people/onyou-nam.jpg
  email: onyou.nam@york.ac.uk
  bio: I completed my Bachelor's degree in Biotechnology at Sejong University in Korea. During this time, I became interested in single-cell organisms, mainly marine phytoplankton. This led to my PhD research in Life Science at Hanyang University in Seoul, Korea, focusing on the biomineralisation mechanism of the coccolithophorid alga *Emiliania huxleyi*, which is an important species for the global carbon cycle. After finishing my PhD, I was delighted to join the Mackinder lab to understand the fundamental biology of carbon fixation in photosynthetic organisms. My project focuses on developing high-throughput approaches to rapidly advance our knowledge of the pyrenoid-based CO₂-concentrating mechanism in the diatom *Thalassiosira pseudonana*. During my spare time, I enjoy walking/travelling with my family and like to watch films and sports.
- name: James Barrett
  role: Postdoctoral Researcher
  photo: /assets/images/people/james-barrett.jpg
  email: james.barrett@york.ac.uk
  website: https://james-r-barrett.github.io/
  bio: I completed my PhD in the Mackinder Lab in 2023, in which I focussed on the identification and characterisation of linker proteins in the pyrenoids of green lineage algae. During this time I developed an interest in understanding the evolutionary timing and apparent convergence of pyrenoid-based CO₂-concentrating mechanisms, as well as in understanding the molecular details driving Rubisco condensation in pyrenoids. My current project in the lab, funded by the Carbon Technology Research Foundation (CTRF), aims to build on the discovery of a plant-compatible pyrenoid linker protein from the green alga Chlorella sorokiniana.
- name: Katy Davis
  role: Postdoctoral Researcher
  photo: /assets/images/people/katy-davis.jpg
  email: katy.davis@york.ac.uk
  bio: Katy completed her PhD in Biochemistry at the University of Cambridge, focussing on Golgi-localised enzymes involved in plant cell wall biosynthesis. She has now returned to York (where she completed her undergraduate degree in biochemistry) to join the Mackinder lab, and is investigating proteins involved in membrane remodelling in Chlamydomonas. In her spare time, Katy enjoys making artwork and experimenting with different media (with varying rates of success!).
- name: Mihris Naduthodi
  role: Postdoctoral Researcher
  photo: /assets/images/people/mihris-naduthodi.jpg
  email: mihris.naduthodi@york.ac.uk
  bio: After completing my Bachelors in Biotechnology and Biochemical Engineering from University of Kerala in India, I moved to the Netherlands in 2015 to pursue my Masters in Cellular and Molecular Biotechnology at the Wageningen University and Research. During this time, I was introduced to the CRISPR-Cas systems and was fascinated by its application as a genome engineering tool across organisms. This interest led me to the lab of John van der Oost, one of the pioneers in the field of CRISPR technology to perform my MSc thesis where I gained experience on using this technology for generating mutants in thermophilic bacteria. Later on, after completing my MSc, I was appointed as a PhD candidate under the supervision of John and Maria Barbosa where I developed novel CRISPR-based genetic tools for microalgae *Nannochloropsis oceanica*. Upon completion of my PhD in 2021 and after working with microalgae for four years, I was curious about the carbon fixing mechanisms in microalgae. Research into this field led me to the Mackinder lab, where I presently study the carbon concentration mechanisms in microalgae.
- name: Justin Lau
  role: Postdoctoral Researcher
  photo: /assets/images/people/justin-lau.jpg
  email: justin.lau@york.ac.uk
  pub_names:
  - Lau CS
  bio: I graduated in BSc Plant sciences at the University of Sheffield in 2016. During my degree, I joined Professor Andrew Fleming’s lab group to investigate the impact of stomatal change on *A. thaliana* histology. At that time I was introduced to the panoply of ways that plant scientists are developing to boost photosynthetic efficiency and improve crop yield. Soon I was fascinated by CCMs, with their often intricate and elegant coupling of physical structure and biochemical pathways. This led to my final year project on light-dark transition of carboxylation/decarboxylation enzyme kinetics in the C4 mechanism in Professor Richard Leegood's group. Continuing this work after graduation, I focused on dissecting enzyme kinetic differences in C4 sub type models. This year, I’m very happy to be in the Mackinder lab, exploring the beauty of another complex CCM. On the weekends, you can normally find me busy in the kitchen making food for my friends for a cosy night in.
