---
layout: default
---
<article class="post">
  <p class="meta"><a href="{{ '/news/' | relative_url }}">News</a> · {{ page.date | date: "%-d %B %Y" }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.image %}<img class="post-image" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}">{% endif %}
  {{ content }}
  {% if page.gallery %}{% include gallery.html photos=page.gallery title=page.title %}{% endif %}
</article>
