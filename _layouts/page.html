---
layout: default
---
<article class="page">
  {% if page.title %}<h1>{{ page.title }}</h1>{% endif %}
  {% if page.notice and page.notice != "" %}<p class="notice">{{ page.notice }}</p>{% endif %}
  {{ content }}
  {% if page.map %}
  <iframe class="map" title="Map of the University of York" loading="lazy"
    src="https://maps.google.com/maps?q=53.947915,-1.0577682&z=15&output=embed"></iframe>
  {% endif %}
</article>
