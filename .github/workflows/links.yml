name: Weekly broken-link check

# Builds the site and checks every link in it. If any are broken, it opens
# (or updates) one GitHub issue listing them, so nothing fails silently.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      # 403 is accepted because journal sites (OUP, Wiley, Science) block automated checks.
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --root-dir "${{ github.workspace }}/_site"
            --no-progress
            --max-retries 3
            --timeout 30
            --accept 200,206,403,429
            --exclude "^https?://(www\.)?(twitter\.com|x\.com|linkedin\.com)"
            --exclude "^https?://scholar\.google\."
            --exclude "^https?://maps\.google\."
            --exclude "^https?://fonts\.(googleapis|gstatic)\.com"
            --exclude "^https://mackinderlab\.github\.io"
            "_site/**/*.html"
          output: lychee/report.md
          fail: false
      - name: Open or update an issue if links are broken
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create broken-links --color d73a4a --description "Found by the weekly link check" --force
          existing=$(gh issue list --label broken-links --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file lychee/report.md
            gh issue comment "$existing" --body "Still broken as of $(date -u +%Y-%m-%d). The list above is updated."
          else
            gh issue create --title "Broken links found on the website" --label broken-links --body-file lychee/report.md
          fi
