{%- assign photos = include.photos | where_exp: "g", "g.image" -%}
{%- if photos.size > 0 -%}
<div class="gallery{% if photos.size == 1 %} gallery-one{% endif %}">
  {%- for g in photos %}
  <figure>
    <button type="button" class="gallery-open" data-index="{{ forloop.index0 }}" aria-label="Enlarge photo {{ forloop.index }}">
      <img src="{{ g.image | relative_url }}" alt="{{ g.caption | default: include.title | escape }}" loading="lazy">
    </button>
    {%- if g.caption %}<figcaption>{{ g.caption }}</figcaption>{% endif %}
  </figure>
  {%- endfor %}
</div>
<dialog class="lightbox" aria-label="Photo viewer">
  <button type="button" class="close" aria-label="Close">×</button>
  {%- if photos.size > 1 %}
  <button type="button" class="nav prev" aria-label="Previous photo">‹</button>
  <button type="button" class="nav next" aria-label="Next photo">›</button>
  {%- endif %}
  <figure><img alt=""><figcaption></figcaption></figure>
</dialog>
<script>
(function () {
  var items = Array.prototype.map.call(document.querySelectorAll('.gallery figure'), function (f) {
    var img = f.querySelector('img'), cap = f.querySelector('figcaption');
    return { src: img.src, alt: img.alt, cap: cap ? cap.textContent : '' };
  });
  var box = document.querySelector('.lightbox'), big = box.querySelector('img'), cap = box.querySelector('figcaption'), i = 0;
  function show(n) {
    i = (n + items.length) % items.length;
    big.src = items[i].src; big.alt = items[i].alt;
    cap.textContent = items[i].cap; cap.hidden = !items[i].cap;
  }
  document.querySelectorAll('.gallery-open').forEach(function (b) {
    b.addEventListener('click', function () { show(+b.dataset.index); box.showModal(); });
  });
  box.querySelector('.close').addEventListener('click', function () { box.close(); });
  box.addEventListener('click', function (e) { if (e.target === box) box.close(); });
  var prev = box.querySelector('.prev'), next = box.querySelector('.next');
  if (prev) prev.addEventListener('click', function () { show(i - 1); });
  if (next) next.addEventListener('click', function () { show(i + 1); });
  box.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' && prev) show(i - 1);
    if (e.key === 'ArrowRight' && next) show(i + 1);
  });
})();
</script>
{%- endif -%}
