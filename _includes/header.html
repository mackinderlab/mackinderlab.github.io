<div class="banner{% if page.url == '/' %} banner-home{% endif %}" role="img" aria-label="{{ site.data.home.banner_alt | escape }}"
  style="background-image:url('{{ site.data.home.banner | relative_url }}')"></div>
<header class="site-header">
  <div class="container header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">Mackinder Lab<span class="site-sub">University of York</span></a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Open menu">
    <label for="nav-toggle" class="nav-toggle-label" aria-hidden="true">Menu</label>
    <nav class="site-nav">
      {% for item in site.data.navigation %}
        {% assign active = false %}
        {% if page.url == item.url %}{% assign active = true %}{% endif %}
        {% if item.url != "/" and page.url contains item.url %}{% assign active = true %}{% endif %}
        <a href="{{ item.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
