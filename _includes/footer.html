<footer class="site-footer">
  <div class="container">
    <p>{{ site.title }} · Department of Biology, University of York · <a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
    {% if site.data.social %}<p>{% for s in site.data.social %}<a href="{{ s.url }}">{{ s.name }}</a>{% unless forloop.last %} · {% endunless %}{% endfor %}</p>{% endif %}
  </div>
</footer>
